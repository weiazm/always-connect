# AlwaysConnect 分享配置。导入：设置 → 通用 → 导入配置…（会先预览，确认后才写入）。
# 代理链接里的 {host}、{password} 这类是分享者没导出的部分，导入时填你自己的。
# 导入的代理和出口保护默认先停用。（本文件为设计示例，内容全部虚构。）

[file]
kind = "alwaysconnect-share"
format = 1
app_version = "0.6.0"
exported = "2026-11-28"
contains_secrets = false
note = "两个代理换成你自己的服务器；出口保护导入后自己打开。"

# 通用开关：导入时默认保持你本机的值，勾选的才改
[general]
drop_protection = true
auto_lan = true
auto_connect_on_launch = true
approval_card = true
site_lists_auto_update = true

# Cisco 服务器：cisco_entry 是 Cisco Secure Client 里的条目名，本机找不到时用 address
[cisco]
group = "Staff"
selected = "VPN-A"

[[cisco.server]]
name = "VPN-A"
cisco_entry = "VPN-A"
address = "vpn-a.example.com"

[[cisco.server]]
name = "VPN-B"
address = "vpn-b.example.com"

# 分流直连：命中的网站不走 Cisco；规则写法与 App 里的规则框相同，例外优先
[split.direct]
rules = [
  "example.com",
  "full:docs.example.org",
  "keyword:examplecdn",
  "geosite:example-list",
  "203.0.113.0/24",
]
exceptions = ["full:login.example.com"]

[[split.direct.group]]
name = "示例分组"
rules = ["a.example.net", "b.example.net"]

# 分流代理：按先后顺序匹配，先命中的生效
[[proxy]]
name = "示例 SOCKS5"
link = "socks5://{username}:{password}@{host}:1080"
rules = ["geosite:example-media", "full:api.example.net"]

[[proxy]]
name = "示例 Hysteria2"
link = "hysteria2://{password}@{host}:443,20000-30000/?sni={sni}&obfs=salamander&obfs-password={obfs_password}&upmbps=50&downmbps=200&hop=30"
rules = ["geosite:example-tools", "198.51.100.0/24"]
exceptions = ["full:static.example.org"]

# 出口保护：这些网站只允许从列出的国家出去
[egress]
steer = true
prefetch = 5
half_life_minutes = 2

[[egress.rule]]
name = "示例：只从美国出口"
sites = ["shop.example.com", "geosite:example-shop"]
exceptions = ["full:cdn.shop.example.com"]
countries = ["US"]
when_unverified = "when_wrong"   # allow 放行 / when_wrong 有异常就拦 / block 一律拦
